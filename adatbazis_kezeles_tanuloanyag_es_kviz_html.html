                    <p><strong>Adatok változtatása:</strong></p>
                    <ul class="list-disc pl-5 space-y-1">
                        <li><strong>Új adat felvétele:</strong> Hivatkozott táblába bármikor felvehető. Hivatkozó táblába csak létező kulcsértékkel vehető fel sor.</li>
                        <li><strong>Törlés és módosítás:</strong>
                            <br>- <em>Korlátozott törlés:</em> A hivatkozott elem nem törölhető, ha van rá hivatkozás a hivatkozó táblában.
                            <br>- <em>Kaszkád (sorozatos) törlés:</em> A hivatkozott elem törlésekor a hivatkozó tábla kapcsolódó sorai is automatikusan törlődnek.
                        </li>
                    </ul>
                `,
                quiz: [
                    { q: "Hol kell szerepelnie a kapcsolómezőnek?", a: ["Csak az egyik táblában", "Mindkét táblában, és legalább az egyikben kulcsnak kell lennie", "Minden adatbázis fájlban", "Csak az űrlapokon"], c: 1, e: "A kapcsolódáshoz mindkét táblában jelen kell lennie, és legalább az egyik oldalon kulcsnak kell lennie." },
                    { q: "Miért bontjuk több táblára az adatokat?", a: ["Mert a gép lassabban olvas egy táblát", "Az áttekinthetőség, hatékonyabb frissítés és jogosultságkezelés miatt", "Mert a relációs modell csak 2 oszlopot enged", "Hogy több fájl legyen a lemezen"], c: 1, e: "A szétválasztás csökkenti az ismétlődéseket és áttekinthetővé teszi az adatbázist." },
                    { q: "Mi a hivatkozási feltétel lényege?", a: ["Az idegen kulcs értéke mindig létező elsődleges kulcsértékre kell mutasson", "Minden mezőben számoknak kell lenniük", "Tilos az adatokat törölni", "Minden táblát jelszóval kell védeni"], c: 0, e: "Nem létezhet árva rekord; az idegen kulcs csak érvényes elsődleges kulcsra hivatkozhat." },
                    { q: "Milyen sor vehető fel a hivatkozó táblába?", a: ["Bármilyen adat, megkötés nélkül", "Csak olyan, aminek idegen kulcsa megegyezik a hivatkozott tábla egy elsődleges kulcsával", "Csak üres rekord", "Csak új kulccsal rendelkező sor"], c: 1, e: "Csak létező hivatkozással rendelkező sor rögzíthető a hivatkozó táblában." },
                    { q: "Mi történik korlátozott törlés esetén?", a: ["Minden rekord törlődik a rendszerből", "Nem engedi törölni a hivatkozott elemet, ha van rá hivatkozás", "Automatikusa felülírja az adatokat nullával", "Törli a hivatkozó tábla sorait is"], c: 1, e: "A korlátozott törlés megvédi az adatkapcsolatot azáltal, hogy megtiltja a használt rekord törlését." },
                    { q: "Mi történik kaszkád törlés esetén?", a: ["A rendszer hibaüzenetet ad", "A hivatkozott elem törlésekor automatikusan törlődik a hivatkozó tábla összes kapcsolódó sora is", "A törölt adatok a kukába kerülnek", "Csak az idegen kulcs mező ürül ki"], c: 1, e: "Kaszkád törlésnél a törlés végiggördül a kapcsolódó táblák függő sorain is." },
                    { q: "Milyen adatokat érdemes a fő táblában (pl. TANULÓ) tárolni?", a: ["Naponta változó adatokat", "Állandó, ritkán változó adatokat", "A törölt rekordokat", "A nyomtatási beállításokat"], c: 1, e: "A törzsadatbázisban az állandó tulajdonságokat célszerű tárolni." },
                    { q: "Honnan törölhető korlátozás nélkül bármelyik sor?", a: ["A hivatkozott táblából", "A hivatkozó táblából", "A gyökér elemből", "Egyikből sem"], c: 1, e: "A hivatkozó (gyermek) táblából törölve nem sérül a hivatkozási integritás." },
                    { q: "Milyen táblát nevezünk hivatkozott táblának?", a: ["Amelyik az idegen kulcsot tartalmazza", "Amelyik az elsődleges kulcsot tartalmazza a kapcsolatban", "Amelyikben nincsenek adatok", "A legkisebb méretű táblát"], c: 1, e: "A hivatkozott (szülő) tábla tartalmazza a hivatkozási alapot adó elsődleges kulcsot." },
                    { q: "Mi történik, ha sérül a hivatkozási feltétel?", a: ["Inkonzisztens és hibás adatbázis-állapot jön létre", "Gyorsabb lesz az SQL lekérdezés", "Automatikusan törlődik az adatbázis", "Semmi probléma nem történik"], c: 0, e: "Integritási hiba keletkezik, az adatok elveszítik a megbízhatóságukat." }
                ]
            }
        ];

        let currentModuleIndex = 0;
        let userAnswers = {}; // { moduleId: { qIndex: selectedOptionIndex } }

        function initApp() {
            renderNav();
            loadModule(0);
        }

        function renderNav() {
            const nav = document.getElementById('nav-container');
            nav.innerHTML = modulesData.map((m, idx) => `
                <button onclick="loadModule(${idx})" id="nav-btn-${idx}" class="w-full text-left p-3 rounded-lg text-sm font-medium transition flex items-center justify-between ${idx === currentModuleIndex ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-400 hover:bg-slate-700/50 hover:text-slate-200'}">
                    <div class="flex items-center space-x-3">
                        <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs ${idx === currentModuleIndex ? 'bg-white text-indigo-600 font-bold' : 'bg-slate-700 text-slate-300'}">${m.id}</span>
                        <span class="truncate max-w-[170px]">${m.title}</span>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 opacity-50"></i>
                </button>
            `).join('');
            lucide.createIcons();
        }

        function loadModule(index) {
            currentModuleIndex = index;
            const data = modulesData[index];

            // Update UI
            document.getElementById('module-badge').innerText = `${data.id}. Modul`;
            document.getElementById('module-title').innerText = data.title;
            document.getElementById('module-theory').innerHTML = data.theory;

            renderNav();
            renderQuiz();
            updateOverallProgress();
        }

        function renderQuiz() {
            const quizContainer = document.getElementById('quiz-form');
            const data = modulesData[currentModuleIndex];
            const savedAnswers = userAnswers[data.id] || {};

            quizContainer.innerHTML = data.quiz.map((q, qIdx) => {
                const selected = savedAnswers[qIdx];
                return `
                    <div id="q-box-${qIdx}" class="p-4 rounded-lg bg-slate-900/50 border border-slate-700/60">
                        <p class="font-medium text-slate-200 text-sm md:text-base mb-3">
                            <span class="text-indigo-400 mr-1">${qIdx + 1}.</span> ${q.q}
                        </p>
                        <div class="space-y-2">
                            ${q.a.map((opt, optIdx) => `
                                <label class="flex items-center p-2.5 rounded-md hover:bg-slate-700/40 cursor-pointer text-xs md:text-sm text-slate-300 transition border border-transparent has-[:checked]:border-indigo-500/50 has-[:checked]:bg-indigo-500/10">
                                    <input type="radio" name="q-${qIdx}" value="${optIdx}" ${selected === optIdx ? 'checked' : ''} onchange="selectAnswer(${qIdx},${optIdx})" class="w-4 h-4 text-indigo-600 bg-slate-700 border-slate-600 focus:ring-indigo-500">
                                    <span class="ml-3">${opt}</span>
                                </label>
                            `).join('')}
                        </div>
                        <div id="explanation-${qIdx}" class="hidden mt-3 p-3 rounded-md text-xs md:text-sm"></div>
                    </div>
                `;
            }).join('');

            updateScoreBadge();
            lucide.createIcons();
        }

        function selectAnswer(qIdx, optIdx) {
            const modId = modulesData[currentModuleIndex].id;
            if (!userAnswers[modId]) userAnswers[modId] = {};
            userAnswers[modId][qIdx] = optIdx;

            updateScoreBadge();
            updateOverallProgress();
        }

        function updateScoreBadge() {
            const modId = modulesData[currentModuleIndex].id;
            const answeredCount = userAnswers[modId] ? Object.keys(userAnswers[modId]).length : 0;
            document.getElementById('quiz-score').innerText = `Kitöltve: ${answeredCount} / 10`;
        }

        function checkAnswers() {
            const data = modulesData[currentModuleIndex];
            const modAnswers = userAnswers[data.id] || {};

            data.quiz.forEach((q, qIdx) => {
                const qBox = document.getElementById(`q-box-${qIdx}`);
                const expBox = document.getElementById(`explanation-${qIdx}`);
                const selectedOpt = modAnswers[qIdx];

                expBox.classList.remove('hidden', 'bg-emerald-950/40', 'text-emerald-300', 'border-emerald-800', 'bg-rose-950/40', 'text-rose-300', 'border-rose-800');
                
                if (selectedOpt === undefined) {
                    expBox.classList.add('bg-slate-800', 'text-slate-400', 'border', 'border-slate-700');
                    expBox.innerHTML = `<strong>Nem válaszoltál!</strong> A helyes válasz: <em>${q.a[q.c]}</em>.<br>${q.e}`;
                } else if (selectedOpt === q.c) {
                    expBox.classList.add('bg-emerald-950/40', 'text-emerald-300', 'border', 'border-emerald-800');
                    expBox.innerHTML = `<div class="flex items-center gap-1 font-semibold mb-1"><i data-lucide="check" class="w-4 h-4"></i> Helyes válasz!</div>${q.e}`;
                } else {
                    expBox.classList.add('bg-rose-950/40', 'text-rose-300', 'border', 'border-rose-800');
                    expBox.innerHTML = `<div class="flex items-center gap-1 font-semibold mb-1"><i data-lucide="x" class="w-4 h-4"></i> Helytelen válasz!</div> A helyes válasz: <strong>${q.a[q.c]}</strong>.<br>${q.e}`;
                }
            });
            lucide.createIcons();
        }

        function resetQuiz() {
            const modId = modulesData[currentModuleIndex].id;
            if (userAnswers[modId]) {
                delete userAnswers[modId];
            }
            renderQuiz();
            updateOverallProgress();
        }

        function updateOverallProgress() {
            let totalQuestions = 0;
            let answeredQuestions = 0;

            modulesData.forEach(m => {
                totalQuestions += m.quiz.length;
                if (userAnswers[m.id]) {
                    answeredQuestions += Object.keys(userAnswers[m.id]).length;
                }
            });

            const percentage = Math.round((answeredQuestions / totalQuestions) * 100);
            document.getElementById('overall-progress-text').innerText = `${percentage}%`;
            document.getElementById('overall-progress-bar').style.width = `${percentage}%`;
        }

        // Initialize on page load
        window.onload = initApp;
    </script>
</body>
</html>
