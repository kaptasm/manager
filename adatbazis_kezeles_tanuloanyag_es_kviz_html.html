                `,
                questions: [

                        correct: 1,
                        explanation: "A GROUP BY a megadott oszlop azonos értékei szerint csoportokba rendezi a sorokat."
                    },
                    {
                        q: "Mi a különbség a WHERE és a HAVING között?",
                        options: [
                            "A WHERE az egyes sorokra vonatkozik a csoportosítás előtt, a HAVING pedig a csoportosított adatokra vonatkozó csoportfeltétel",
                            "Nincs különbség, a kettő szinoníma",
                            "A HAVING csak számokra használható, a WHERE csak szövegre",
                            "A WHERE törli az adatokat, a HAVING módosítja"
                        ],
                        correct: 0,
                        explanation: "A WHERE a nyers sorokat szűri a csoportképzés előtt, a HAVING a GROUP BY utáni aggregált csoportokra tesz feltételt."
                    },
                    {
                        q: "Melyik oszlopfüggvény számolja meg a rekordok számát?",
                        options: ["SUM()", "AVG()", "COUNT()", "MAX()"],
                        correct: 2,

                    },
                    {
                        q: "Melyik oszlopfüggvényt használjuk az értékek átlagának kiszámítására?",
                        options: ["SUM()", "AVG()", "TOTAL()", "MEAN()"],
                        correct: 1,
                        explanation: "Az AVG() (Average) számítja ki a kijelölt mező értékeinek átlagát."
                    },
                    {
                        q: "Melyik SQL utasítással végzünk adatfrissítést (pl. 20%-os fizetésemelés)?",
                        options: ["CHANGE", "UPDATE", "MODIFY", "REPLACE"],
                        correct: 1,
                        explanation: "Az UPDATE utasítással módosíthatók a táblában lévő meglévő adatok (pl. UPDATE Dolgozok SET fizetes = fizetes * 1.2)."
                    },
                    {
                        q: "Mi a DELETE utasítás feladata?",
                        options: [
                            "Teljes táblastruktúra megsemmisítése",
                            "Adott feltételnek megfelelő rekordok (sorok) törlése a táblából",
                            "Egy mező átnevezése",
                            "A legutóbbi mentés visszavonása"
                        ],
                        correct: 1,
                        explanation: "A DELETE a feltételnek megfelelő rekordokat törli a táblából."
                    },
                    {
                        q: "Hogyan hozható létre új tábla egy lekérdezés eredményéből?",
                        options: [
                            "SELECT ... INTO [ÚjTábla] FROM ...",
                            "CREATE TABLE AS SELECT ...",
                            "MAKE TABLE ...",
                            "EXPORT TO TABLE ..."

                        correct: 0,
                        explanation: "A tananyagban megadott Access SQL szintaxis szerint a `SELECT mezők INTO [ÚjTábla] FROM tábla` hoz létre új táblát."

                        q: "Mi a Paraméteres lekérdezés jellemzője?",
                        options: [

                            "A lekérdezés futtatásakor egy párbeszédablakban kéri be a szűrési értéket a felhasználótól",
                            "Nem tartalmazhat WHERE feltételt",
                            "Kizárólag éjfélkor futtatható"
                        ],
                        correct: 1,
                        explanation: "A paraméteres lekérdezés futtatáskor rákérdez az értékre (pl. [Kérem a típust:])."
                    },
                    {
                        q: "Mit ad vissza a `SELECT MAX(Érték) FROM Auto WHERE Tipus='Opel'` lekérdezés?",
                        options: [
                            "Az Opelek átlagos értékét",
                            "A legolcsóbb Opel árát",
                            "A legdrágább Opel értékét",
                            "Az Opelek darabszámát"
                        ],
                        correct: 2,
                        explanation: "A MAX() függvény az adat halmazban található legnagyobb értéket (a legdrágább Opel árát) adja vissza."
                    },

                        q: "Melyik utasítást használjuk meglévő táblához más táblából származó rekordok HOZZÁFŰZÉSÉRE?",
                        options: [
                            "UPDATE INTO tábla2 SELECT ...",
                            "INSERT INTO tábla2 SELECT ... FROM tábla1",
                            "ADD TO tábla2 FROM tábla1",
                            "JOIN tábla1 TO tábla2"

                        correct: 1,
                        explanation: "Az INSERT INTO tábla2 SELECT... utasítással fűzhetők hozzá a kiválasztott sorok egy másik táblához."

        /* STATE VARIABLES */
        let currentModuleIndex = 0;
        let userAnswers = {}; // Format: { moduleIndex: { questionIndex: selectedOptionIndex } }
        let evaluatedModules = {}; // Format: { moduleIndex: true/false }

        // Initialize App on DOM Load
        document.addEventListener("DOMContentLoaded", () => {
            renderNav();
            loadModule(0);
        });

        // Render Sidebar Navigation
        function renderNav() {
            const nav = document.getElementById("nav-container");
            nav.innerHTML = "";

            modulesData.forEach((mod, idx) => {
                const btn = document.createElement("button");
                btn.onclick = () => loadModule(idx);
                btn.className = `w-full text-left p-3 rounded-xl transition-all flex items-center justify-between text-xs md:text-sm font-medium ${
                    idx === currentModuleIndex 
                        ? "bg-blue-600/30 border border-blue-500/50 text-blue-300 shadow-md" 
                        : "hover:bg-slate-800/80 text-slate-400 hover:text-slate-200"
                }`;

                const statusBadge = evaluatedModules[idx] 
                    ? `<span class="w-2 h-2 rounded-full bg-emerald-400"></span>`
                    : `<span class="w-2 h-2 rounded-full bg-slate-700"></span>`;

                btn.innerHTML = `
                    <div class="truncate pr-2">
                        <span class="block text-[10px] text-slate-500 font-semibold uppercase">Modul ${mod.id}</span>
                        <span class="truncate">${mod.title}</span>
                    </div>
                    ${statusBadge}
                `;
                nav.appendChild(btn);
            });

            updateOverallProgress();
        }

        // Load Active Module Content
        function loadModule(index) {
            currentModuleIndex = index;
            const mod = modulesData[index];

            document.getElementById("module-badge").innerText = mod.badge;
            document.getElementById("module-title").innerText = mod.title;
            document.getElementById("summary-content").innerHTML = mod.summary;

            renderQuiz();
            renderNav();
            switchTab('summary'); // Default to summary tab on module change
        }

        // Switch between Summary and Quiz tabs
        function switchTab(tab) {
            const summaryView = document.getElementById("summary-view");
            const quizView = document.getElementById("quiz-view");
            const summaryBtn = document.getElementById("tab-summary-btn");
            const quizBtn = document.getElementById("tab-quiz-btn");

            if (tab === 'summary') {
                summaryView.classList.remove("hidden");
                quizView.classList.add("hidden");

                summaryBtn.className = "px-4 py-2 rounded-xl font-medium text-sm transition-all bg-blue-600 text-white shadow-lg shadow-blue-600/30";
                quizBtn.className = "px-4 py-2 rounded-xl font-medium text-sm transition-all bg-slate-800 text-slate-300 hover:bg-slate-700";
            } else {
                summaryView.classList.add("hidden");
                quizView.classList.remove("hidden");

                quizBtn.className = "px-4 py-2 rounded-xl font-medium text-sm transition-all bg-blue-600 text-white shadow-lg shadow-blue-600/30";
                summaryBtn.className = "px-4 py-2 rounded-xl font-medium text-sm transition-all bg-slate-800 text-slate-300 hover:bg-slate-700";
            }
        }

        // Render 10 Questions for the current module
        function renderQuiz() {
            const form = document.getElementById("quiz-form");
            form.innerHTML = "";
            const mod = modulesData[currentModuleIndex];
            const isEvaluated = evaluatedModules[currentModuleIndex] || false;
            const answers = userAnswers[currentModuleIndex] || {};

            mod.questions.forEach((q, qIdx) => {
                const qCard = document.createElement("div");
                qCard.className = "glass-card p-5 md:p-6 rounded-2xl space-y-4 border border-slate-800";

                let headerText = `<div class="font-semibold text-white text-base flex gap-2">
                    <span class="text-blue-400 font-bold">${qIdx + 1}.</span> 
                    <span>${q.q}</span>
                </div>`;

                let optionsHtml = `<div class="space-y-2 pt-2">`;

                q.options.forEach((opt, optIdx) => {
                    const isChecked = answers[qIdx] === optIdx;
                    let optionStyle = "bg-slate-900/80 border-slate-800 text-slate-300 hover:border-slate-700";

                    if (isEvaluated) {
                        if (optIdx === q.correct) {
                            optionStyle = "bg-emerald-950/60 border-emerald-500/80 text-emerald-200 font-medium"; // Correct option highlight
                        } else if (isChecked && optIdx !== q.correct) {
                            optionStyle = "bg-rose-950/60 border-rose-500/80 text-rose-200"; // Wrong selected option highlight
                        }
                    } else if (isChecked) {
                        optionStyle = "bg-blue-900/40 border-blue-500 text-blue-200 font-medium";
                    }

                    optionsHtml += `
                        <label class="flex items-start gap-3 p-3 rounded-xl border transition-all cursor-pointer ${optionStyle}">
                            <input type="radio" name="q_${qIdx}" value="${optIdx}" ${isChecked ? "checked" : ""} ${isEvaluated ? "disabled" : ""} 
                                onchange="selectAnswer(${currentModuleIndex}, ${qIdx}, ${optIdx})" 
                                class="mt-1 text-blue-600 focus:ring-blue-500 bg-slate-900 border-slate-700">
                            <span class="text-xs md:text-sm leading-relaxed">${opt}</span>
                        </label>
                    `;
                });

                optionsHtml += `</div>`;

                // Explanation Block after evaluation
                let explanationHtml = "";
                if (isEvaluated) {
                    const userSel = answers[qIdx];
                    const isCorrect = userSel === q.correct;

                    explanationHtml = `
                        <div class="mt-4 p-4 rounded-xl text-xs md:text-sm leading-relaxed ${isCorrect ? 'bg-emerald-900/20 border border-emerald-500/30 text-emerald-300' : 'bg-rose-900/20 border border-rose-500/30 text-rose-300'}">
                            <div class="font-bold mb-1 flex items-center gap-2">
                                ${isCorrect ? '✅ Helyes válasz!' : '❌ Helytelen válasz!'}
                            </div>
                            <div>
                                ${!isCorrect ? `<p class="mb-1"><strong>A helyes válasz:</strong> ${q.options[q.correct]}</p>` : ''}
                                <p class="text-slate-300 mt-1"><strong>Miért?</strong> ${q.explanation}</p>
                            </div>
                        </div>
                    `;
                }

                qCard.innerHTML = headerText + optionsHtml + explanationHtml;
                form.appendChild(qCard);
            });

            // Update Score Badge if evaluated
            const scoreBadge = document.getElementById("quiz-score-badge");
            if (isEvaluated) {
                let score = 0;
                mod.questions.forEach((q, qIdx) => {
                    if (answers[qIdx] === q.correct) score++;
                });
                document.getElementById("score-val").innerText = score;
                scoreBadge.classList.remove("hidden");
            } else {
                scoreBadge.classList.add("hidden");
            }
        }

        // Store User Selected Option
        function selectAnswer(modIdx, qIdx, optIdx) {
            if (!userAnswers[modIdx]) userAnswers[modIdx] = {};
            userAnswers[modIdx][qIdx] = optIdx;
        }

        // Evaluate Quiz for current module
        function evaluateQuiz() {
            const mod = modulesData[currentModuleIndex];
            const answers = userAnswers[currentModuleIndex] || {};

            // Check if all questions are answered
            if (Object.keys(answers).length < mod.questions.length) {
                const unansweredCount = mod.questions.length - Object.keys(answers).length;
                if(!confirm(`Még ${unansweredCount} kérdésre nem válaszoltál! Biztosan ellenőrizni akarod most?`)) {
                    return;
                }
            }

            evaluatedModules[currentModuleIndex] = true;
            renderQuiz();
            renderNav();
        }

        // Reset Quiz for current module
        function resetQuiz() {
            delete userAnswers[currentModuleIndex];
            delete evaluatedModules[currentModuleIndex];
            renderQuiz();
            renderNav();
        }

        // Overall progress calculation across 9 modules
        function updateOverallProgress() {
            const totalModules = modulesData.length;
            const completedModules = Object.keys(evaluatedModules).length;
            const percent = Math.round((completedModules / totalModules) * 100);

            document.getElementById("overall-progress-text").innerText = `${percent}%`;
            document.getElementById("overall-progress-bar").style.width = `${percent}%`;
        }
    </script>
