<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Doboz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#151210;
    --bg-2:#1e1a16;
    --wood-1:#3a2a1e;
    --wood-2:#2a1d14;
    --brass:#c9a24b;
    --brass-dim:#8a6f3a;
    --copper:#b5651d;
    --paper:#f0ead6;
    --paper-dim:#c9c0a8;
    --danger:#8a3b32;
  }

  *{box-sizing:border-box;}

  html,body{
    height:100%;
    margin:0;
    background:
      radial-gradient(ellipse at 50% 20%, #241d17 0%, var(--bg-1) 55%, #0d0b09 100%);
    color:var(--paper);
    font-family:'Space Mono', monospace;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
    opacity:0.5;
  }

  .stage{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:34px;
    padding:40px 20px;
    z-index:1;
  }

  .eyebrow{
    font-size:11px;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:var(--brass-dim);
    text-align:center;
  }

  .title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(28px,4vw,42px);
    letter-spacing:0.01em;
    color:var(--paper);
    text-align:center;
    margin:0;
  }

  .title em{
    font-style:italic;
    color:var(--brass);
  }

  /* --- THE BOX --- */
  .box-wrap{
    position:relative;
    width:280px;
    height:200px;
    perspective:1200px;
  }

  .box-shadow{
    position:absolute;
    bottom:-22px;
    left:50%;
    transform:translateX(-50%);
    width:240px;
    height:26px;
    background:radial-gradient(ellipse, rgba(0,0,0,0.55) 0%, transparent 70%);
    filter:blur(2px);
    transition:opacity 0.6s ease, transform 0.6s ease;
  }

  .box{
    position:relative;
    width:100%;
    height:100%;
    border-radius:6px;
    background:
      linear-gradient(160deg, var(--wood-1) 0%, var(--wood-2) 100%);
    box-shadow:
      0 18px 40px rgba(0,0,0,0.55),
      inset 0 0 0 1px rgba(255,255,255,0.04);
    border:1px solid #100c09;
    overflow:hidden;
  }

  .box::before{
    /* wood grain */
    content:"";
    position:absolute;
    inset:0;
    background-image:repeating-linear-gradient(
      95deg,
      rgba(0,0,0,0.12) 0px,
      rgba(0,0,0,0.12) 2px,
      transparent 2px,
      transparent 14px
    );
    mix-blend-mode:multiply;
    opacity:0.6;
  }

  .glow{
    position:absolute;
    inset:10px;
    border-radius:3px;
    background:radial-gradient(ellipse at 50% 40%, rgba(255,205,110,0.9) 0%, rgba(255,150,60,0.35) 45%, transparent 75%);
    opacity:0;
    transition:opacity 1s ease;
    pointer-events:none;
  }

  .lid{
    position:absolute;
    top:0; left:0; right:0;
    height:56%;
    background:
      linear-gradient(160deg, #46331f 0%, var(--wood-2) 100%);
    border-bottom:2px solid #0f0b08;
    transform-origin:top center;
    transform:rotateX(0deg);
    transition:transform 1.1s cubic-bezier(.6,-0.28,.4,1.4), box-shadow 1.1s ease;
    box-shadow:inset 0 -14px 18px -14px rgba(0,0,0,0.6);
    z-index:3;
  }

  .lid::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:repeating-linear-gradient(
      95deg, rgba(0,0,0,0.14) 0px, rgba(0,0,0,0.14) 2px, transparent 2px, transparent 14px
    );
    mix-blend-mode:multiply;
  }

  .rivet{
    position:absolute;
    width:7px;
    height:7px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #eccf8f, var(--brass-dim) 70%);
    box-shadow:0 1px 1px rgba(0,0,0,0.6);
  }
  .r1{top:8px;left:10px;} .r2{top:8px;right:10px;}
  .r3{bottom:8px;left:10px;} .r4{bottom:8px;right:10px;}

  .plate{
    position:absolute;
    left:50%;
    bottom:14%;
    transform:translateX(-50%);
    width:64px;
    height:44px;
    border-radius:4px;
    background:linear-gradient(160deg, #d9b969, var(--brass-dim));
    box-shadow:0 2px 6px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.25);
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .plate::after{
    content:"";
    width:10px;
    height:14px;
    border-radius:3px 3px 0 0;
    background:#3a2a10;
    box-shadow:0 5px 0 -1px #3a2a10;
  }

  .keyhole{
    position:absolute;
    width:8px; height:8px;
    border-radius:50%;
    background:#2a1c0d;
  }

  .box.open .lid{
    transform:rotateX(-118deg) translateY(-2px);
    box-shadow:0 -10px 20px rgba(0,0,0,0.4);
  }
  .box.open .glow{ opacity:1; }
  .box.open .plate{ opacity:0; transition:opacity .3s ease; }
  .box.open .box-shadow{ transform:translateX(-50%) scale(1.15); }

  .box.shake{ animation:shake 0.42s ease; }
  @keyframes shake{
    10%,90%{ transform:translateX(-2px) }
    20%,80%{ transform:translateX(4px) }
    30%,50%,70%{ transform:translateX(-7px) }
    40%,60%{ transform:translateX(7px) }
  }

  /* --- KEYPAD --- */
  .panel{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }

  .code-row{
    display:flex;
    gap:12px;
  }

  .digit{
    width:48px;
    height:58px;
    border-radius:4px;
    background:linear-gradient(180deg, #211b16, #17130f);
    border:1px solid #3a2f24;
    box-shadow:inset 0 2px 4px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.02);
    color:var(--brass);
    font-family:'Space Mono', monospace;
    font-size:26px;
    text-align:center;
    caret-color:var(--brass);
    outline:none;
    transition:border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .digit:focus{
    border-color:var(--brass);
    box-shadow:inset 0 2px 4px rgba(0,0,0,0.5), 0 0 0 3px rgba(201,162,75,0.15);
  }
  .digit.err{ border-color:var(--danger); }

  .hint{
    font-size:11px;
    letter-spacing:0.08em;
    color:var(--paper-dim);
    min-height:16px;
    text-align:center;
    transition:color 0.3s ease;
  }
  .hint.err{ color:#d98d81; }
  .hint.ok{ color:var(--brass); }

  .submit{
    margin-top:4px;
    padding:12px 30px;
    background:transparent;
    border:1px solid var(--brass-dim);
    color:var(--brass);
    font-family:'Space Mono', monospace;
    font-size:12px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    border-radius:2px;
    cursor:pointer;
    transition:background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
  }
  .submit:hover{
    background:var(--brass);
    color:#1a140c;
    border-color:var(--brass);
  }
  .submit:disabled{
    opacity:0.4;
    cursor:default;
    background:transparent;
    color:var(--brass);
  }

  .footer-note{
    font-size:10.5px;
    color:#5a5044;
    letter-spacing:0.05em;
    text-align:center;
    max-width:280px;
  }

  @media (prefers-reduced-motion: reduce){
    .lid, .box-shadow, .glow, .box.shake{ transition:none; animation:none; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="eyebrow">HÁROM SZÁMJEGY &nbsp;·&nbsp; EGY DOBOZ</div>
  <h1 class="title">Ismered a <em>kódot</em>?</h1>

  <div class="box-wrap">
    <div class="box-shadow" id="boxShadow"></div>
    <div class="box" id="box">
      <div class="glow"></div>
      <div class="plate">
        <div class="keyhole"></div>
      </div>
      <div class="lid">
        <div class="rivet r1"></div>
        <div class="rivet r2"></div>
        <div class="rivet r3"></div>
        <div class="rivet r4"></div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="code-row">
      <input class="digit" id="d0" type="text" inputmode="numeric" maxlength="1" autocomplete="off">
      <input class="digit" id="d1" type="text" inputmode="numeric" maxlength="1" autocomplete="off">
      <input class="digit" id="d2" type="text" inputmode="numeric" maxlength="1" autocomplete="off">
    </div>
    <button class="submit" id="submitBtn">Kinyitás</button>
    <div class="hint" id="hint">&nbsp;</div>
  </div>

  <div class="footer-note">A helyes kód megnyitja a dobozt, és új lapon megjeleníti a dokumentumot.</div>
</div>

<script>
  // ---- BEÁLLÍTÁS ----
  // Cseréld ki az alábbi elérési utat a saját PDF fájlodra
  // (lehet relatív útvonal, pl. "dokumentum.pdf", vagy teljes URL is).
  const CORRECT_CODE = "774";
  const PDF_URL = "dokumentum.pdf";

  const inputs = [document.getElementById('d0'), document.getElementById('d1'), document.getElementById('d2')];
  const box = document.getElementById('box');
  const hint = document.getElementById('hint');
  const submitBtn = document.getElementById('submitBtn');
  let unlocked = false;

  inputs.forEach((inp, i) => {
    inp.addEventListener('input', () => {
      inp.value = inp.value.replace(/[^0-9]/g, '').slice(0, 1);
      inp.classList.remove('err');
      if (inp.value && i < inputs.length - 1) {
        inputs[i + 1].focus();
      }
    });
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !inp.value && i > 0) {
        inputs[i - 1].focus();
      }
      if (e.key === 'Enter') {
        attemptUnlock();
      }
    });
  });

  submitBtn.addEventListener('click', attemptUnlock);

  function attemptUnlock() {
    if (unlocked) return;
    const code = inputs.map(i => i.value).join('');

    if (code.length < 3) {
      showHint('Add meg mind a három számjegyet.', 'err');
      return;
    }

    if (code === CORRECT_CODE) {
      unlock();
    } else {
      fail();
    }
  }

  function unlock() {
    unlocked = true;
    box.classList.add('open');
    showHint('A doboz kinyílt.', 'ok');
    submitBtn.disabled = true;

    setTimeout(() => {
      window.open(PDF_URL, '_blank');
    }, 950);
  }

  function fail() {
    box.classList.remove('shake');
    void box.offsetWidth; // reflow, hogy az animáció újra lejátszódjon
    box.classList.add('shake');
    inputs.forEach(i => i.classList.add('err'));
    showHint('Helytelen kód. Próbáld újra.', 'err');
    inputs[0].select();
    inputs[0].focus();
  }

  function showHint(text, type) {
    hint.textContent = text;
    hint.className = 'hint ' + (type || '');
  }

  inputs[0].focus();
</script>

</body>
</html>
